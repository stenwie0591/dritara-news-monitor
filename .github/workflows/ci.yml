name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip_audit -r requirements.lock --require-hashes
      - run: python -m pip check
      - run: python -m compileall -q main.py src tests
      - run: python scripts/check_docs.py
      - run: python -m scripts.check_secret_hygiene
      - run: python -m pytest tests --tb=short --capture=no
